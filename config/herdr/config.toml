# https://herdr.dev/docs/configuration/
# https://herdr.dev/docs/config-reference/

onboarding = false

[experimental]
kitty_graphics = true
pane_history = true

[keys]
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
split_vertical = "prefix+|"
split_horizontal = "prefix+_"

[[keys.command]]
key = "prefix+ctrl+d"
type = "pane"
command = "revdiff"

[theme]
auto_switch = false
name = "tokyo-night"

[theme.custom]
accent = "#82aaff"
panel_bg = "#1a1b26"
#sidebar_bg = "#1e2030"
active_row_bg = "#292e42"
selection_bg = "#222436"
surface0 = "#1e2030" #"#222436"
surface1 = "#1e2030" #"#292e42"
surface_dim = "#1e2030"
overlay0 = "#545c7e"
overlay1 = "#737aa2"
text = "#c8d3f5"
subtext0 = "#828bb8"
mauve = "#c099ff"
green = "#c3e88d"
yellow = "#ffc777"
red = "#ff757f"
blue = "#82aaff"
teal = "#4fd6be"
peach = "#ff966c"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false

[ui.sidebar.spaces]
row_gap = 1

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab"],
  ["state_text", { token = "agent", dim = false }],
]

[ui.sound]
enabled = false

[ui.toast.clipboard]
position = "top-right"

[ui.toast.herdr]
position = "top-right"
