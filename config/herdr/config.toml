# https://herdr.dev/docs/configuration/
# https://herdr.dev/docs/config-reference/

onboarding = false

[experimental]
kitty_graphics = true
pane_history = true

[keys]
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
split_vertical = "prefix+|"
split_horizontal = "prefix+_"

[[keys.command]]
key = "prefix+ctrl+d"
type = "pane"
command = "revdiff"

[theme]
auto_switch = false
name = "tokyo-night"

[theme.custom]
surface0 = "#1E2030"
surface1 = "#1E2030"
surface_dim = "#1E2030"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false

[ui.sidebar.spaces]
row_gap = 1

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab"],
  ["state_text", { token = "agent", dim = false }],
]

[ui.sound]
enabled = false

[ui.toast.clipboard]
position = "top-right"

[ui.toast.herdr]
position = "top-right"
