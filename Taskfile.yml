# https://taskfile.dev

version: '3'

silent: true

dotenv:
  - .env.local

vars:
  THEMES:
    - tokyonight_moon
    - tokyonight_mike

tasks:
  create-symlink-safe:
    internal: true
    cmds:
      - '{{.USER_WORKING_DIR}}/scripts/symlink-safe.sh "{{.SOURCE}}" "{{.TARGET}}"'

  default:
    desc: List all available tasks
    cmds:
      - task --list-all

  1password-ssh:
    desc: Setup 1password SSH agent
    platforms:
      - darwin
    vars:
      AGENT_SOCK: '{{.HOME}}/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock'
    preconditions:
      - sh: test -S "{{.AGENT_SOCK}}"
        msg: Enable the 1Password SSH agent (Settings > Developer > SSH Agent)
    cmds:
      - mkdir -p {{.HOME}}/.1password
      - ln -sf "{{.AGENT_SOCK}}" {{.HOME}}/.1password/agent.sock

  agents:
    desc: Setup AI agents
    env:
      DISABLE_TELEMETRY: 1
    vars:
      SKILL_SOURCES:
        # https://github.com/addyosmani/clarity
        - repo: addyosmani/clarity
          skills: []
        # https://github.com/ast-grep/agent-skill
        - repo: ast-grep/agent-skill
          skills: []
        # https://github.com/anthropics/skills
        - repo: anthropics/skills
          skills:
            - frontend-design
            - skill-creator
        # https://github.com/backnotprop/plannotator
        - repo: backnotprop/plannotator/apps/skills/core
          skills:
            - plannotator
        # https://github.com/blader/humanizer
        - repo: blader/humanizer
          skills: []
        # https://github.com/boldsoftware/exe.dev
        - repo: boldsoftware/exe.dev/skill
          skills: []
        # https://github.com/cloudflare/skills
        - repo: cloudflare/skills
          skills: []
        # https://github.com/cloudflare/security-audit-skill
        - repo: cloudflare/security-audit-skill
          skills: []
        # https://github.com/docker/skills
        - repo: docker/skills
          skills: []
        # https://github.com/forrestchang/andrej-karpathy-skills
        - repo: forrestchang/andrej-karpathy-skills
          skills: []
        # https://github.com/GoogleChrome/modern-web-guidance
        - repo: GoogleChrome/modern-web-guidance
          skills: []
        # https://github.com/herdrdev/herdr
        - repo: herdrdev/herdr
          skills:
            - herdr
        # https://github.com/jakubkrehel/make-interfaces-feel-better
        - repo: jakubkrehel/make-interfaces-feel-better
          skills: []
        # https://github.com/jakubkrehel/oklch-skill
        - repo: jakubkrehel/oklch-skill
          skills: []
        # https://github.com/JetBrains/go-modern-guidelines
        - repo: JetBrains/go-modern-guidelines
          skills:
            - use-modern-go
        # https://github.com/longbridge/gpui-kit
        - repo: longbridge/gpui-kit
          skills: []
        # https://github.com/mcollina/skills
        - repo: mcollina/skills
          skills:
            - node
            - typescript-magician
        # https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
        - repo: nextlevelbuilder/ui-ux-pro-max-skill
          skills:
            - ui-ux-pro-max
            - ui-styling
        # https://github.com/planetscale/database-skills
        - repo: planetscale/database-skills
          skills:
            - mysql
            - postgres
        # https://github.com/shadcn-ui/ui
        - repo: shadcn/ui
          skills:
            - shadcn
        # https://github.com/softaworks/agent-toolkit
        - repo: softaworks/agent-toolkit
          skills:
            - mermaid-diagrams
        # https://github.com/stripe/ai
        - repo: stripe/ai
          skills:
            - stripe-best-practices
        # https://github.com/umputun/revdiff
        - repo: umputun/revdiff
          skills:
            - revdiff
        # https://github.com/vercel-labs/agent-browser
        - repo: vercel-labs/agent-browser
          skills:
            - agent-browser
        # https://github.com/vercel-labs/agent-skills
        - repo: vercel-labs/agent-skills
          skills:
            - vercel-react-best-practices
            - vercel-composition-patterns
        # https://github.com/vercel-labs/opensrc
        - repo: vercel-labs/opensrc
          skills:
            - opensrc
        # https://github.com/yusukebe/ax
        - repo: yusukebe/ax
          skills: []
        # https://github.com/mike182uk/agent-skills
        - repo: mike182uk/agent-skills
          skills: []
    preconditions:
      - mise which skills
      - command -v gh
      - sh: gh auth status >/dev/null 2>&1
        msg: Run `gh auth login` first
    cmds:
      - mkdir -p {{.HOME}}/.agents/skills
      - rm -f {{.HOME}}/.agents/.skill-lock.json
      - for: { var: SKILL_SOURCES }
        cmd: mise exec -- skills add {{.ITEM.repo}} {{range .ITEM.skills}}-s {{.}} {{end}}-a claude-code -a opencode -g -y

  atuin:
    desc: Setup atuin config
    vars:
      # Task passes empty .env.local values on to commands, and atuin fails on an empty ATUIN_SYNC_ADDRESS
      NO_EMPTY_ATUIN: '{{if not .ATUIN_SYNC_ADDRESS}}env -u ATUIN_SYNC_ADDRESS{{end}}'
    preconditions:
      - command -v atuin
    cmds:
      - mkdir -p {{.HOME}}/.config/atuin
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/atuin/config.toml'
          TARGET: '{{.HOME}}/.config/atuin/config.toml'
      - mkdir -p {{.HOME}}/.config/opencode/plugins
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/opencode/plugins/atuin.ts'
          TARGET: '{{.HOME}}/.config/opencode/plugins/atuin.ts'
      - '{{.NO_EMPTY_ATUIN}} atuin hook install claude-code'
      - '{{.NO_EMPTY_ATUIN}} atuin hook install codex'

  bat:
    desc: Setup bat config
    preconditions:
      - command -v bat
    cmds:
      - mkdir -p {{.HOME}}/.config/bat/themes
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/bat/config'
          TARGET: '{{.HOME}}/.config/bat/config'
      - for: { var: THEMES }
        task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/themes/{{.ITEM}}.tmTheme'
          TARGET: '{{.HOME}}/.config/bat/themes/{{.ITEM}}.tmTheme'
      - bat cache --build

  bin:
    desc: Symlink config/bin scripts into ~/.local/bin
    cmds:
      - mkdir -p {{.HOME}}/.local/bin
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/bin/syscfg-env'
          TARGET: '{{.HOME}}/.local/bin/syscfg-env'

  brew-bundle:
    desc: Update brewfile with installed formulae / casks
    platforms:
      - darwin
    preconditions:
      - command -v brew
    cmds:
      # Dump installed state and partition into Brewfile (portable) and
      # Brewfile.macos (macOS-only formulae, casks, mas)
      - '{{.USER_WORKING_DIR}}/scripts/brew-bundle-split.sh "{{.USER_WORKING_DIR}}/config/homebrew"'

  brew-install:
    desc: Install formulae / casks listed in Brewfile
    preconditions:
      - command -v brew
    cmds:
      - brew trust --tap umputun/apps yusukebe/tap mike182uk/tap
      - brew bundle --file {{.USER_WORKING_DIR}}/config/homebrew/Brewfile
      - cmd: brew bundle --file {{.USER_WORKING_DIR}}/config/homebrew/Brewfile.macos
        platforms:
          - darwin

  btop:
    desc: Setup btop config
    preconditions:
      - command -v btop
    cmds:
      - mkdir -p {{.HOME}}/.config/btop/themes
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/btop/btop.conf'
          TARGET: '{{.HOME}}/.config/btop/btop.conf'
      - for: { var: THEMES }
        task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/btop/themes/{{.ITEM}}.theme'
          TARGET: '{{.HOME}}/.config/btop/themes/{{.ITEM}}.theme'

  bun:
    desc: Setup Bun config
    preconditions:
      - mise which bun
    cmds:
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/bun/bunfig.toml'
          TARGET: '{{.HOME}}/.bunfig.toml'

  check-gh-ssh:
    internal: true
    preconditions:
      - sh: gh auth status >/dev/null 2>&1
        msg: Run `gh auth login` (choose SSH, and skip uploading a key)
      # `ssh -T` exits 1 even on success, so check its greeting instead
      - sh: ssh -T -o BatchMode=yes -o StrictHostKeyChecking=accept-new git@github.com 2>&1 | grep -q "successfully authenticated"
        msg: GitHub does not accept your SSH key - add ~/.ssh/id_ed25519.pub at https://github.com/settings/ssh/new as an authentication and a signing key

  claude:
    desc: Setup Claude code
    preconditions:
      - command -v curl
      - sh: test -n "{{.EXECUTOR_URL}}"
        msg: EXECUTOR_URL must be set in .env.local
    cmds:
      - mkdir -p {{.HOME}}/.claude/themes
      # Settings
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/claude/settings.json'
          TARGET: '{{.HOME}}/.claude/settings.json'
      # Statusline
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/claude/scripts/statusline.sh'
          TARGET: '{{.HOME}}/.claude/statusline.sh'
      # Executor MCP auth headers
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/claude/scripts/executor-headers.sh'
          TARGET: '{{.HOME}}/.claude/executor-headers.sh'
      # Theme
      - for: { var: THEMES }
        task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/claude/themes/{{.ITEM}}.json'
          TARGET: '{{.HOME}}/.claude/themes/{{.ITEM}}.json'
      # Agents config
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/agents/AGENTS.md'
          TARGET: '{{.HOME}}/.claude/CLAUDE.md'
      # Install
      - curl -fsSL https://claude.ai/install.sh | bash
      # MCP
      - |
        # The installer puts claude in ~/.local/bin, which may not be on PATH yet on a new machine
        export PATH="{{.HOME}}/.local/bin:$PATH"

        mcp_add() {
          if output=$(claude mcp add --scope user "$@" 2>&1); then
            printf '%s\n' "$output"
          else
            code=$?
            printf '%s\n' "$output" >&2
            case "$output" in
            "MCP server "*" already exists in user config") ;;
            *) return "$code" ;;
            esac
          fi
        }

        # mcp_add chrome-devtools -- npx -y chrome-devtools-mcp@latest
        # mcp_add --transport http incidentio-work https://mcp.incident.io/mcp
        # mcp_add --transport http linear-work https://mcp.linear.app/mcp
        # mcp_add --transport http notion-work https://mcp.notion.com/mcp
        # mcp_add playwright npx @playwright/mcp@latest
        # mcp_add --transport http sentry-work https://mcp.sentry.dev/mcp

        claude mcp remove --scope user executor >/dev/null 2>&1 || true
        claude mcp add-json --scope user executor "{\"type\":\"http\",\"url\":\"${EXECUTOR_URL}\",\"headersHelper\":\"{{.HOME}}/.claude/executor-headers.sh\"}"

  dev-dirs:
    desc: Setup developer directory structure (DEV_DIR)
    preconditions:
      - sh: test -n "{{.DEV_DIR}}"
        msg: DEV_DIR must be set in .env.local
    cmds:
      - mkdir -p {{.DEV_DIR}}/repos/oss {{.DEV_DIR}}/repos/personal
      - mkdir -p {{.DEV_DIR}}/worktrees/oss {{.DEV_DIR}}/worktrees/personal

  editorconfig:
    desc: Setup editorconfig config
    cmds:
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/editorconfig/editorconfig'
          TARGET: '{{.HOME}}/.editorconfig'

  fish:
    desc: Setup 🐟 config
    cmds:
      - mkdir -p {{.HOME}}/.config
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/fish'
          TARGET: '{{.HOME}}/.config/fish'
      - '[ -f {{.HOME}}/.config/fish/config.local.fish ] || touch {{.HOME}}/.config/fish/config.local.fish'
      - '{{.USER_WORKING_DIR}}/scripts/set-default-shell.sh'

  fish-init:
    desc: Install fisher and plugins
    preconditions:
      - command -v fish
    cmds:
      # Install fisher
      - fish -c 'curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher'
      # Install plugins
      - fish -c 'fisher update'

  fzf:
    desc: Setup fzf config
    cmds:
      - mkdir -p {{.HOME}}/.config/fzf
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/fzf/fzfrc'
          TARGET: '{{.HOME}}/.config/fzf/fzfrc'

  ghostty:
    desc: Setup Ghostty config
    platforms:
      - darwin
    cmds:
      - mkdir -p {{.HOME}}/.config/ghostty
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/ghostty/config'
          TARGET: '{{.HOME}}/.config/ghostty/config'
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/ghostty/themes'
          TARGET: '{{.HOME}}/.config/ghostty/themes'

  herdr:
    desc: Setup Herdr config
    preconditions:
      - command -v herdr
    cmds:
      - mkdir -p {{.HOME}}/.config/herdr
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/herdr/config.toml'
          TARGET: '{{.HOME}}/.config/herdr/config.toml'
      - herdr server reload-config || true
      - herdr integration install opencode
      - herdr integration install claude
      - herdr integration install codex

  git:
    desc: Setup Git config
    preconditions:
      - command -v git
      - sh: test -n "{{.GIT_USERNAME}}"
        msg: GIT_USERNAME must be set in .env.local
      - sh: test -n "{{.GIT_EMAIL}}"
        msg: GIT_EMAIL must be set in .env.local
    cmds:
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/git/gitattributes'
          TARGET: '{{.HOME}}/.gitattributes'
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/git/gitignore'
          TARGET: '{{.HOME}}/.gitignore'
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/git/gitconfig.local'
          TARGET: '{{.HOME}}/.gitconfig.local'
      - git config --global include.path ~/.gitconfig.local
      - git config --global user.name "{{.GIT_USERNAME}}"
      - git config --global user.email "{{.GIT_EMAIL}}"
      # Use SSH for GitHub (the 1Password SSH agent on macOS, ~/.ssh/id_ed25519 on Linux)
      - git config --global url."ssh://git@github.com/".insteadOf https://github.com/

  git-signing:
    desc: Setup Git commit signing with SSH
    vars:
      # macOS signs with the key in 1Password, Linux with the key from the ssh-key task
      SIGNING_KEY: '{{if eq OS "darwin"}}{{.GIT_SIGNING_KEY}}{{else}}{{.HOME}}/.ssh/id_ed25519.pub{{end}}'
      GPG_SSH_PROGRAM: '{{if eq OS "darwin"}}/Applications/1Password.app/Contents/MacOS/op-ssh-sign{{else}}ssh-keygen{{end}}'
    preconditions:
      - command -v git
      - sh: test -n "{{.SIGNING_KEY}}"
        msg: GIT_SIGNING_KEY must be set in .env.local
      - sh: test "{{OS}}" = darwin || test -f "{{.SIGNING_KEY}}"
        msg: '{{.SIGNING_KEY}} not found - run the ssh-key task first'
      - sh: command -v "{{.GPG_SSH_PROGRAM}}"
        msg: '{{.GPG_SSH_PROGRAM}} not found - is 1Password installed?'
    cmds:
      - git config --global commit.gpgsign true
      - git config --global gpg.format ssh
      - git config --global gpg.ssh.program "{{.GPG_SSH_PROGRAM}}"
      - git config --global user.signingkey "{{.SIGNING_KEY}}"

  go:
    desc: Setup Go env
    preconditions:
      - mise which go
    cmds:
      - mise exec -- go env -w GOPATH={{.HOME}}/.local/share/go
      - mise exec -- go env -w GOBIN={{.HOME}}/.local/bin

  mise:
    desc: Setup mise config
    preconditions:
      - command -v mise
    cmds:
      - mkdir -p {{.HOME}}/.config/mise
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/mise/config.toml'
          TARGET: '{{.HOME}}/.config/mise/config.toml'
      - mise install

  macos:
    desc: Configure macOS
    platforms:
      - darwin
    cmds:
      - '{{.USER_WORKING_DIR}}/scripts/setup-macos.sh'

  nvim:
    desc: Setup Neovim config
    preconditions:
      - command -v nvim
    cmds:
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/nvim'
          TARGET: '{{.HOME}}/.config/nvim'

  opencode:
    desc: Setup OpenCode config
    vars:
      COMMAND_FILES:
        sh: ls {{.USER_WORKING_DIR}}/config/opencode/commands/*.md 2>/dev/null || true
    cmds:
      - mkdir -p {{.HOME}}/.config/opencode/commands {{.HOME}}/.config/opencode/themes
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/opencode/opencode.jsonc'
          TARGET: '{{.HOME}}/.config/opencode/opencode.jsonc'
      - 'test -e "{{.HOME}}/.config/opencode/cli.json" || cp "{{.USER_WORKING_DIR}}/config/opencode/cli.json" "{{.HOME}}/.config/opencode/cli.json"'
      - for: { var: THEMES }
        task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/opencode/themes/{{.ITEM}}.json'
          TARGET: '{{.HOME}}/.config/opencode/themes/{{.ITEM}}.json'
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/agents/AGENTS.md'
          TARGET: '{{.HOME}}/.config/opencode/AGENTS.md'
      - for: { var: COMMAND_FILES }
        task: create-symlink-safe
        vars:
          SOURCE: '{{.ITEM}}'
          TARGET: '{{.HOME}}/.config/opencode/commands/{{base .ITEM}}'

  # https://plannotator.ai/install.sh
  plannotator:
    desc: Install Plannotator CLI and configure for OpenCode
    env:
      DISABLE_TELEMETRY: 1
    vars:
      INSTALL_DIR: '{{.HOME}}/.local/bin'
      REPO: backnotprop/plannotator
      COMMANDS_DIR: '{{.HOME}}/.config/opencode/commands'
      TAG:
        sh: gh release view --repo backnotprop/plannotator --json tagName -q .tagName 2>/dev/null || true
      # Release assets use x64/arm64 (not Go's amd64) in the arch token
      ARCH_TOKEN:
        sh: 'case "{{ARCH}}" in amd64) echo x64;; *) echo "{{ARCH}}";; esac'
      BINARY_URL: 'https://github.com/backnotprop/plannotator/releases/download/{{.TAG}}/plannotator-{{OS}}-{{.ARCH_TOKEN}}'
    preconditions:
      - command -v curl
      - command -v sha256sum || command -v shasum
      - command -v gh
      - sh: gh auth status >/dev/null 2>&1
        msg: Run `gh auth login` first
    cmds:
      - mkdir -p {{.INSTALL_DIR}}
      # Download CLI binary and verify checksum
      - curl -fsSL -o /tmp/plannotator "{{.BINARY_URL}}"
      - |
        if command -v sha256sum >/dev/null; then
          ACTUAL=$(sha256sum /tmp/plannotator | cut -d' ' -f1)
        else
          ACTUAL=$(shasum -a 256 /tmp/plannotator | cut -d' ' -f1)
        fi
        EXPECTED=$(curl -fsSL "{{.BINARY_URL}}.sha256" | cut -d' ' -f1)
        [ "$ACTUAL" = "$EXPECTED" ] || { echo "Checksum verification failed!" >&2; exit 1; }
      # Verify SLSA build provenance
      - gh attestation verify /tmp/plannotator --repo {{.REPO}} --source-ref "refs/tags/{{.TAG}}" --signer-workflow "{{.REPO}}/.github/workflows/release.yml"
      - rm -f {{.INSTALL_DIR}}/plannotator
      - mv /tmp/plannotator {{.INSTALL_DIR}}/plannotator
      - chmod +x {{.INSTALL_DIR}}/plannotator
      - '{{.INSTALL_DIR}}/plannotator install-runtime agent-terminal || echo "Skipped agent terminal runtime install"'
      # Download OpenCode slash commands from the release tag
      - mkdir -p {{.COMMANDS_DIR}}
      - curl -fsSL -o "{{.COMMANDS_DIR}}/plannotator-review.md" "https://raw.githubusercontent.com/{{.REPO}}/{{.TAG}}/apps/opencode-plugin/commands/plannotator-review.md"
      - curl -fsSL -o "{{.COMMANDS_DIR}}/plannotator-annotate.md" "https://raw.githubusercontent.com/{{.REPO}}/{{.TAG}}/apps/opencode-plugin/commands/plannotator-annotate.md"
      - curl -fsSL -o "{{.COMMANDS_DIR}}/plannotator-last.md" "https://raw.githubusercontent.com/{{.REPO}}/{{.TAG}}/apps/opencode-plugin/commands/plannotator-last.md"
      # Clear cached plugin and jiti cache to force fresh download
      - rm -rf {{.HOME}}/.cache/opencode/node_modules/@plannotator {{.HOME}}/.cache/opencode/packages/@plannotator {{.HOME}}/.cache/opencode/npm/@plannotator {{.HOME}}/.bun/install/cache/@plannotator /tmp/jiti 2>/dev/null || true
      - mkdir -p {{.HOME}}/.plannotator
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/plannotator/config.json'
          TARGET: '{{.HOME}}/.plannotator/config.json'
      - echo "plannotator {{.TAG}} installed"

  raycast:
    desc: Install Raycast preferences
    platforms:
      - darwin
    cmds:
      - mkdir -p {{.HOME}}/.config/raycast
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/raycast/script-commands'
          TARGET: '{{.HOME}}/.config/raycast/script-commands'

  revdiff:
    desc: Setup revdiff config and OpenCode integration
    vars:
      REPO: umputun/revdiff
      OPENCODE_DIR: '{{.HOME}}/.config/opencode'
      TAG:
        sh: gh release view --repo umputun/revdiff --json tagName -q .tagName 2>/dev/null || true
      RAW: 'https://raw.githubusercontent.com/{{.REPO}}/{{.TAG}}'
    preconditions:
      - command -v revdiff
      - command -v curl
      - command -v gh
      - sh: gh auth status >/dev/null 2>&1
        msg: Run `gh auth login` first
    cmds:
      - mkdir -p {{.HOME}}/.config/revdiff/themes
      - revdiff --init-themes > /dev/null 2>&1 || true
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/revdiff/config'
          TARGET: '{{.HOME}}/.config/revdiff/config'
      - for: { var: THEMES }
        task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/revdiff/themes/{{.ITEM}}'
          TARGET: '{{.HOME}}/.config/revdiff/themes/{{.ITEM}}'
      # https://github.com/umputun/revdiff/blob/master/plugins/opencode/README.md
      # Plan-review plugin intentionally skipped - plannotator handles plan review
      - mkdir -p {{.OPENCODE_DIR}}/commands {{.OPENCODE_DIR}}/plugins {{.OPENCODE_DIR}}/tools
      - curl -fsSL -o "{{.OPENCODE_DIR}}/commands/revdiff.md" "{{.RAW}}/plugins/opencode/commands/revdiff.md"
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/opencode/plugins/revdiff.ts'
          TARGET: '{{.OPENCODE_DIR}}/plugins/revdiff.ts'
      - curl -fsSL -o "{{.OPENCODE_DIR}}/tools/launch-revdiff.sh" "{{.RAW}}/.claude-plugin/skills/revdiff/scripts/launch-revdiff.sh"
      - chmod +x "{{.OPENCODE_DIR}}/tools/launch-revdiff.sh"

  ripgrep:
    desc: Setup ripgrep config
    preconditions:
      - command -v rg
    cmds:
      - mkdir -p {{.HOME}}/.config/ripgrep
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/ripgrep/config'
          TARGET: '{{.HOME}}/.config/ripgrep/config'

  scratch-dir:
    desc: Setup scratch directory (SCRATCH_DIR)
    preconditions:
      - sh: test -n "{{.SCRATCH_DIR}}"
        msg: SCRATCH_DIR must be set in .env.local
    cmds:
      - mkdir -p {{.SCRATCH_DIR}}

  setup-linux:
    desc: Run all Linux setup tasks in the recommended order
    platforms:
      - linux
    cmds:
      - task: brew-install
      - task: ssh
      - task: ssh-key
      - task: check-gh-ssh
      - task: git
      - task: git-signing
      - task: dev-dirs
      - task: scratch-dir
      - task: bin
      - task: fish
      - task: fish-init
      - task: mise
      - task: go
      - task: nvim
      - task: starship
      - task: editorconfig
      - task: ripgrep
      - task: bat
      - task: btop
      - task: fzf
      - task: atuin
      - task: bun
      - task: claude
      - task: opencode
      - task: herdr
      - task: revdiff
      - task: worktrunk
      - task: plannotator
      - task: zsh
      - task: agents

  ssh:
    desc: Setup SSH config
    vars:
      SSH_CONFIG_FILE: '{{if eq OS "darwin"}}config.macos{{else}}config{{end}}'
    cmds:
      - mkdir -p {{.HOME}}/.ssh
      - chmod 700 {{.HOME}}/.ssh
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/ssh/{{.SSH_CONFIG_FILE}}'
          TARGET: '{{.HOME}}/.ssh/config'

  ssh-key:
    desc: Setup SSH key
    platforms:
      - linux
    cmds:
      - mkdir -p {{.HOME}}/.ssh
      - chmod 700 {{.HOME}}/.ssh
      - '[ -f {{.HOME}}/.ssh/id_ed25519 ] || ssh-keygen -t ed25519 -C "$GIT_EMAIL" -f {{.HOME}}/.ssh/id_ed25519 -N ""'
      - echo "SSH public key:"
      - cat {{.HOME}}/.ssh/id_ed25519.pub

  starship:
    desc: Setup starship config
    cmds:
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/starship/starship.toml'
          TARGET: '{{.HOME}}/.config/starship.toml'

  sublime-text:
    desc: Setup Sublime Text config
    platforms:
      - darwin
    vars:
      ST_CFG_PATH: '{{.HOME}}/Library/Application Support/Sublime Text/Packages/User'
      ST_PKG_PATH: '{{.HOME}}/Library/Application Support/Sublime Text/Installed Packages'
    cmds:
      - mkdir -p '{{.ST_CFG_PATH}}'
      - mkdir -p '{{.ST_PKG_PATH}}'
      # https://packagecontrol.io/installation
      - '[ -f "{{.ST_PKG_PATH}}/Package Control.sublime-package" ] || curl -sL -o "{{.ST_PKG_PATH}}/Package Control.sublime-package" "https://packagecontrol.io/Package%20Control.sublime-package"'
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/sublime-text/Preferences.sublime-settings'
          TARGET: '{{.ST_CFG_PATH}}/Preferences.sublime-settings'
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/sublime-text/Default (OSX).sublime-keymap'
          TARGET: '{{.ST_CFG_PATH}}/Default (OSX).sublime-keymap'
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/sublime-text/Package Control.sublime-settings'
          TARGET: '{{.ST_CFG_PATH}}/Package Control.sublime-settings'

  worktrunk:
    desc: Setup worktrunk config
    preconditions:
      - command -v wt
    cmds:
      - mkdir -p {{.HOME}}/.config/worktrunk
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/worktrunk/config.toml'
          TARGET: '{{.HOME}}/.config/worktrunk/config.toml'
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/worktrunk/herdr-worktree.sh'
          TARGET: '{{.HOME}}/.config/worktrunk/herdr-worktree.sh'
      - wt config shell install fish --yes
      - wt config plugins opencode install --yes

  zed:
    desc: Setup Zed config
    platforms:
      - darwin
    cmds:
      - mkdir -p {{.HOME}}/.config/zed
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/zed/settings.json'
          TARGET: '{{.HOME}}/.config/zed/settings.json'
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/zed/keymap.json'
          TARGET: '{{.HOME}}/.config/zed/keymap.json'

  zsh:
    desc: Setup zsh config
    cmds:
      - task: create-symlink-safe
        vars:
          SOURCE: '{{.USER_WORKING_DIR}}/config/zsh/zprofile'
          TARGET: '{{.HOME}}/.zprofile'
